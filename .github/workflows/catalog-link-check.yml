name: Catalog link check (temporary)
on:
  push:
    branches: [claude/catalog-link-check]
    paths: [app/src/main/assets/uzi_catalog.tsv, tools/catalog/**, .github/workflows/catalog-link-check.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/catalog/check_catalog_links.py --json tools/catalog/links-report.json || true
      - run: python3 tools/catalog/check_catalog_links.py tools/catalog/candidates.tsv --json tools/catalog/candidates-report.json || true
      - run: |
          git config user.name "link-check"
          git config user.email "link-check@users.noreply.github.com"
          git add tools/catalog/*-report.json
          git commit -m "report" && git push
