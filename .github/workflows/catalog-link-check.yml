name: Catalog link check (temporary)
on:
  push:
    branches: [claude/catalog-link-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/catalog/check_catalog_links.py --json links.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: links
          path: links.json
