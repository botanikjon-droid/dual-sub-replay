# Calls the real Edge voice service through the app's own client (EdgeVoiceLiveTest) and reports
# the result as annotations, so a silent Sardor/Madina can be diagnosed without the phone.
name: Uzbek voice live check

on:
  workflow_dispatch:
  push:
    paths:
      - app/src/uzTest/**
      - app/src/uz/java/com/kienhoang/dualsubreplay/dubbing/**
      - .github/workflows/uz-voice-check.yml

jobs:
  check:
    if: github.repository == 'botanikjon-droid/dual-sub-replay'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Install Android build SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Live voice test
        env:
          LIVE_VOICE_TEST: "1"
        run: bash ./gradlew testDebugUnitTest -Pdistribution=uz --tests '*EdgeVoiceLiveTest*' --info
      - name: Report the result as annotations
        if: always()
        run: |
          shopt -s nullglob
          for f in app/build/test-results/testDebugUnitTest/*EdgeVoiceLiveTest*.xml; do
            python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          out = (root.findtext("system-out") or "").strip().replace("\n", " | ")
          print(f"::notice title=voice output::{out[:900]}")
          for case in root.iter("testcase"):
              for tag in ("failure", "error"):
                  node = case.find(tag)
                  if node is not None:
                      msg = ((node.get("message") or "") + " | " + (node.text or "")[:700]).replace("\n", " | ")
                      print(f"::error title=voice {tag}::{msg}")
              if case.find("skipped") is not None:
                  print("::warning title=voice::test skipped")
          PY
          done
