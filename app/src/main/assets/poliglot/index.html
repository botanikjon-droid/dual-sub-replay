<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Poliglot</title>
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6680; --line:#DCE2EC;
  --accent:#E8622C; --accent-soft:#FDEBE2; --accent-ink:#A8401A;
  --rev:#3B5BDB; --rev-soft:#E5EAFD;
  --ok:#1E9B6A; --ok-soft:#E1F4EC; --ar:#0F6E78; --ar-soft:#E0F1F2;
  --body:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Roboto Condensed","Roboto",system-ui,sans-serif;
  --arabic:"Noto Naskh Arabic","Noto Sans Arabic","Geeza Pro","Arial",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font:700 20px/1 var(--display);margin:0;flex:1;letter-spacing:.4px}
.badge{background:rgba(255,255,255,.12);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.days{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:0 0 auto;min-width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums;position:relative}
.days button.today{border-color:var(--accent);color:var(--accent-ink)}
.days button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.days button.done::after{content:"";position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.days button:disabled{opacity:.4}
main{max-width:640px;margin:0 auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font:700 17px/1.25 var(--display);margin:0;flex:1}
.head{display:flex;align-items:center;gap:8px}
.num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-weight:700;font-size:13px;display:grid;place-items:center}
.card.ar .num{background:var(--ar-soft);color:var(--ar)}
.muted{color:var(--muted)} .small{font-size:13px}
.done-box{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted);user-select:none;white-space:nowrap}
.done-box input{width:22px;height:22px;accent-color:var(--ok)}
.card.checked{border-color:#9ED6BE}
.card.checked .done-box{color:var(--ok)}
.hero{background:var(--ink);color:#fff;border:0}
.hero .topic{font:700 22px/1.2 var(--display)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.story{font-size:17px;line-height:1.75}
.w{border-radius:5px;padding:0 2px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent}
.w.new{color:var(--accent-ink);background:var(--accent-soft);border-color:var(--accent)}
.w.review{color:var(--rev);background:var(--rev-soft);border-color:var(--rev)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .n::before{background:var(--accent)} .legend .r::before{background:var(--rev)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:4px 10px;font-size:13px;border:1px solid var(--line);background:var(--surface)}
.chip.new{background:var(--accent-soft);border-color:transparent}
.chip.review{background:var(--rev-soft);border-color:transparent}
.chip b{font-weight:700}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:6px}
.btn.soft{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn.accent{background:var(--accent)}
.btn.icon{padding:8px 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hadith{background:#FBF7EE;border:1px solid #EADFC4}
.hadith blockquote{margin:0;font-size:16px;font-style:italic}
.q{display:flex;flex-direction:column;gap:6px}
.q label{font-weight:700;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
textarea,input[type=text],input[type=number],input[type=time],input[type=date]{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#FAFBFD}
textarea{min-height:58px;resize:vertical}
.with-mic{display:flex;gap:6px;align-items:flex-start}
.with-mic textarea,.with-mic input{flex:1}
.frame{font-size:16px;line-height:2.4}
.frame input[type=text]{width:8.5em;max-width:100%;display:inline-block;padding:4px 8px;margin:0 2px}
.letters{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;direction:rtl}
.letters span{font:400 46px/1.2 var(--arabic);width:68px;height:76px;border-radius:12px;background:var(--ar-soft);color:var(--ar);display:grid;place-items:center}
.arw{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.arw .a{font:400 30px/1.3 var(--arabic);direction:rtl;color:var(--ar)}
.fluency{display:flex;gap:6px}
.fluency button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.fluency button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.forgot{display:flex;flex-wrap:wrap;gap:6px}
.forgot label{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;display:flex;gap:5px;align-items:center}
.forgot label:has(input:checked){background:#FDE8E8;border-color:#E9A3A3}
pre.report{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px;margin:0;font:13px/1.5 ui-monospace,monospace}
.empty{text-align:center;padding:30px 14px}
#tip{position:fixed;left:16px;right:16px;bottom:20px;max-width:520px;margin:0 auto;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;display:none;gap:10px;align-items:center;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#tip.show{display:flex}
#tip .t{flex:1} #tip .en{font-weight:700} #tip .uz{opacity:.9}
#tip button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 10px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ok);color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;display:none;z-index:30}
.foot a{color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Poliglot</h1>
  <span class="badge" id="streak" title="Seriya">🔥 0</span>
  <span class="badge" id="total">0/30</span>
</header>
<div class="days" id="days" role="tablist" aria-label="Kunlar"></div>
<main id="main"><div class="card empty muted">Yuklanmoqda…</div></main>
<div id="tip" role="dialog" aria-live="polite"><div class="t"><div class="en"></div><div class="uz"></div></div><button type="button" id="tipSay" aria-label="Tinglash">🔊</button><button type="button" id="tipClose" aria-label="Yopish">✕</button></div>
<div id="toast"></div>
<script src="course.js"></script>
<script>
(function () {
  "use strict";
  var A = window.Android || null;
  var C = window.PGCore;
  var KEY = "poliglot-v2";
  var content = null;
  var S = null;
  var view = 1;
  var micTarget = null;

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function toast(text) {
    var t = $("toast"); t.textContent = text; t.style.display = "block";
    clearTimeout(toast.timer); toast.timer = setTimeout(function () { t.style.display = "none"; }, 1800);
  }

  // ---- Saqlash: telefon xotirasidagi fayl (Android), localStorage — zaxira nusxa ----
  function load() {
    var raw = null;
    try { if (A && A.loadData) raw = A.loadData(KEY); } catch (e) {}
    if (!raw) { try { raw = localStorage.getItem(KEY); } catch (e) {} }
    try { var s = JSON.parse(raw || "null"); if (s && s.v === 2) return s; } catch (e) {}
    return null;
  }
  function save() {
    var json = JSON.stringify(S);
    try { localStorage.setItem(KEY, json); } catch (e) {}
    try { if (A && A.saveData) A.saveData(KEY, json); } catch (e) {}
    pushTexts();
  }
  function rec(n) {
    if (!S.days[n]) S.days[n] = { tasks: {}, answers: [], retell: [], writing: [], minutes: "", fluency: 0, forgotten: [], note: "" };
    return S.days[n];
  }

  function today() { return C.dayNumber(S.start, new Date()); }

  /** Eslatma matnlari: ertalab — bugungi vazifa, kechqurun — hisobot. */
  function pushTexts() {
    if (!A || !A.setTexts || !content) return;
    var n = today();
    var d = C.dayOf(content, n);
    var morning = d ? n + "-kun: " + d.topic_uz + " (" + d.topic_en + "). Hikoya va vazifalar kutyapti." :
      n + "-kun: bugungi hikoya hali qo'shilmagan, oldingi kunlarni takrorlang.";
    var done = C.taskIds(content).filter(function (id) { return rec(n).tasks[id]; }).length;
    var evening = "Kechki hisobot vaqti: " + done + "/" + C.taskIds(content).length +
      " vazifa bajarildi. Hisobotni to'ldirib, Claude'ga yuboring.";
    try { A.setTexts(morning, evening); } catch (e) {}
  }

  function speak(text, lang, rate) {
    if (A && A.speak) { try { A.speak(text, lang || "en-US", rate || 0.9); return; } catch (e) {} }
    if (window.speechSynthesis) {
      var u = new SpeechSynthesisUtterance(text); u.lang = lang || "en-US"; u.rate = rate || 0.9;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    }
  }
  function listen(target) {
    micTarget = target;
    if (A && A.listen) { try { A.listen("en-US"); return; } catch (e) {} }
    toast("Mikrofon faqat telefonda ishlaydi");
  }

  // ---- Kunlar qatori ----
  function renderDays() {
    var t = today();
    var html = "";
    for (var n = 1; n <= C.TOTAL_DAYS; n++) {
      var has = !!C.dayOf(content, n);
      var cls = [n === view ? "on" : "", n === t ? "today" : "", C.isDayDone(content, S.days[n]) ? "done" : ""].join(" ");
      html += '<button type="button" role="tab" class="' + cls + '" data-day="' + n + '"' + (has ? "" : " disabled") +
        ' aria-label="' + n + '-kun' + (has ? "" : ", tez orada") + '">' + n + "</button>";
    }
    $("days").innerHTML = html;
    var on = $("days").querySelector("button.on");
    if (on && on.scrollIntoView) on.scrollIntoView({ block: "nearest", inline: "center" });
    $("streak").textContent = "🔥 " + C.streak(content, S, t);
    $("total").textContent = C.completedDays(content, S) + "/" + C.TOTAL_DAYS;
  }

  function taskBox(id) {
    var checked = rec(view).tasks[id] ? " checked" : "";
    return '<label class="done-box"><input type="checkbox" data-task="' + id + '"' + checked + "> Bajarildi</label>";
  }
  function taskLabel(id) {
    var t = (content.daily_tasks_template || []).filter(function (x) { return x.id === id; })[0];
    return t ? t.uz : "";
  }
  function section(num, title, id, body, extra) {
    var done = id && rec(view).tasks[id];
    return '<section class="card ' + (extra || "") + (done ? " checked" : "") + '" data-section="' + (id || "") + '">' +
      '<div class="head"><span class="num">' + num + "</span><h2>" + esc(title) + "</h2>" + (id ? taskBox(id) : "") + "</div>" +
      (id ? '<div class="muted small">' + esc(taskLabel(id)) + "</div>" : "") + body + "</section>";
  }

  // ---- Kunlik karta ----
  function renderDay() {
    var d = C.dayOf(content, view);
    var r = rec(view);
    if (!d) {
      $("main").innerHTML = '<div class="card empty"><h2>' + view + '-kun</h2><p class="muted">Bu kun hikoyasi keyinroq qo\'shiladi. ' +
        "Hozircha oldingi kunlarni takrorlang.</p></div>" + settingsCard();
      bindSettings();
      return;
    }
    var forgotYesterday = (S.days[view - 1] && S.days[view - 1].forgotten) || [];
    var review = C.reviewWords(content, view, forgotYesterday);
    var ids = C.taskIds(content);
    var doneCount = ids.filter(function (id) { return r.tasks[id]; }).length;
    var date = C.uzDate(C.dateOfDay(S.start, view));
    var html = "";

    html += '<section class="card hero"><div class="row"><span class="badge">' + view + "-kun · " + date + "</span>" +
      (view === today() ? '<span class="badge">Bugun</span>' : "") + "</div>" +
      '<div class="topic">' + esc(d.topic_en) + "</div><div>" + esc(d.topic_uz) + "</div>" +
      '<div class="bar" aria-hidden="true"><i style="width:' + Math.round(doneCount * 100 / ids.length) + '%"></i></div>' +
      '<div class="small">' + doneCount + "/" + ids.length + " vazifa" + (C.isDayDone(content, r) ? " · ✓ kun bajarildi" : " · kun bajarilishi uchun " + (Math.floor(ids.length / 2) + 1) + " ta") + "</div></section>";

    // 1. Hikoya
    var segs = C.storySegments(d.story, d.new_words, review);
    var story = segs.map(function (s) {
      if (!s.kind) return esc(s.text);
      return '<span class="w ' + s.kind + '" role="button" tabindex="0" data-en="' + esc(s.en) + '" data-uz="' + esc(s.uz) + '">' + esc(s.text) + "</span>";
    }).join("");
    var chips = d.new_words.map(function (w) { return '<span class="chip new"><b>' + esc(w.en) + "</b> — " + esc(w.uz) + "</span>"; }).join("") +
      review.map(function (w) {
        return '<span class="chip review"><b>' + esc(w.en) + "</b> — " + esc(w.uz) + (w.from === "unutilgan" ? " ↺" : "") + "</span>";
      }).join("");
    html += section(1, "Hikoya: " + d.story_title, "story_read",
      '<div class="legend"><span class="n">yangi so\'z</span><span class="r">takrorlash</span><span class="muted">So\'zni bosing — tarjimasi chiqadi</span></div>' +
      '<div class="story">' + story + "</div>" +
      '<div class="row"><button type="button" class="btn" data-say="story">🔊 Tinglash</button>' +
      '<button type="button" class="btn soft" data-say="story-slow">🐢 Sekin</button></div>' +
      '<div class="chips">' + chips + "</div>");

    // 2. Hadis
    if (d.hadith) {
      html += '<section class="card hadith"><div class="head"><span class="num">☪</span><h2>Hadis</h2>' +
        '<button type="button" class="btn soft icon" data-say="hadith" aria-label="Hadisni tinglash">🔊</button></div>' +
        "<blockquote>“" + esc(d.hadith.en) + "”</blockquote><div>" + esc(d.hadith.uz) + '</div><div class="muted small">Manba: ' + esc(d.hadith.source) + "</div></section>";
    }

    // 3. Savollar
    html += section(2, "Savollar", "story_questions", d.questions.map(function (q, i) {
      return '<div class="q"><label for="ans' + i + '">' + (i + 1) + ". " + esc(q) +
        ' <button type="button" class="btn soft icon" data-sayq="' + i + '" aria-label="Savolni tinglash">🔊</button></label>' +
        '<div class="with-mic"><textarea id="ans' + i + '" data-field="answers" data-i="' + i + '" placeholder="To\'liq gap bilan javob bering">' +
        esc(r.answers[i] || "") + '</textarea><button type="button" class="btn soft icon" data-mic="ans' + i + '" aria-label="Ovozda aytish">🎤</button></div></div>';
    }).join(""));

    // 4. Qayta aytish
    var blank = 0;
    var frame = esc(d.retell_frame).replace(/_{2,}/g, function () {
      var i = blank++;
      return '<input type="text" data-field="retell" data-i="' + i + '" value="' + esc(r.retell[i] || "") + '" aria-label="Bo\'sh joy ' + (i + 1) + '">';
    });
    html += section(3, "Qayta aytish", "retell",
      '<div class="frame">' + frame + "</div>" +
      '<div class="row"><button type="button" class="btn" data-say="retell">🔊 O\'qib berish</button><span class="muted small">To\'ldiring, keyin ovoz chiqarib ayting</span></div>');

    // 5. Yozish
    html += section(4, "Yozish", "write", [0, 1, 2].map(function (i) {
      return '<div class="with-mic"><input type="text" id="wr' + i + '" data-field="writing" data-i="' + i + '" placeholder="' + (i + 1) +
        '-gap" value="' + esc(r.writing[i] || "") + '"><button type="button" class="btn soft icon" data-mic="wr' + i + '" aria-label="Ovozda aytish">🎤</button></div>';
    }).join("") + '<div class="muted small" id="usedWords"></div>');

    // 6. Agent bilan suhbat
    var mode = S.mode || "suhbat";
    html += section(5, "Agent bilan suhbat", "agent_talk",
      '<div class="row" role="radiogroup" aria-label="Rejim">' + [["suhbat", "Suhbat"], ["hikoya", "Hikoya"], ["rol", "Rolli o'yin"]].map(function (m) {
        return '<button type="button" class="btn ' + (mode === m[0] ? "" : "soft") + '" data-mode="' + m[0] + '" role="radio" aria-checked="' + (mode === m[0]) + '">' + m[1] + "</button>";
      }).join("") + "</div>" +
      '<button type="button" class="btn accent" id="talk">💬 Let\'s talk</button>' +
      '<div class="muted small">Claude ilovasi english-speaking-partner ko\'nikmasi bilan ochiladi; matn nusxalanadi. 5 daqiqa gaplashib, "Bajarildi"ni belgilang.</div>');

    // 7. Arab harflari
    html += section(6, "Arab harflari", "arabic_letters",
      '<div class="letters">' + d.arabic.letters.map(function (l) {
        return '<span role="button" tabindex="0" data-ar="' + esc(l) + '">' + esc(l) + "</span>";
      }).join("") + "</div>" +
      "<div>" + esc(d.arabic.note_uz) + "</div>" +
      '<div class="arw">' + d.arabic.words.map(function (w) {
        return '<span class="a">' + esc(w.ar) + "</span><span><b>" + esc(w.tr) + "</b> — " + esc(w.uz) + "</span>" +
          '<button type="button" class="btn soft icon" data-ar="' + esc(w.ar) + '" aria-label="Tinglash">🔊</button>';
      }).join("") + "</div>", "ar");

    // Kechki hisobot
    var all = d.new_words.concat(review);
    html += '<section class="card" id="report"><div class="head"><span class="num">🌙</span><h2>Kechki hisobot</h2></div>' +
      '<div class="row"><label class="grow">Vaqt (daqiqa)<input type="number" min="0" max="600" inputmode="numeric" data-field="minutes" value="' + esc(r.minutes) + '"></label></div>' +
      '<div>Ravonlik</div><div class="fluency" role="radiogroup" aria-label="Ravonlik">' + [1, 2, 3, 4, 5].map(function (f) {
        return '<button type="button" data-fluency="' + f + '" class="' + (r.fluency === f ? "on" : "") + '" role="radio" aria-checked="' + (r.fluency === f) + '">' + f + "</button>";
      }).join("") + "</div>" +
      '<div>Unutilgan so\'zlar <span class="muted small">(ertangi takrorlashga qo\'shiladi)</span></div><div class="forgot">' + all.map(function (w) {
        var on = r.forgotten.indexOf(w.en) >= 0 ? " checked" : "";
        return '<label><input type="checkbox" data-forgot="' + esc(w.en) + '"' + on + ">" + esc(w.en) + "</label>";
      }).join("") + "</div>" +
      '<label>Izoh<textarea data-field="note" placeholder="Bugun nima qiyin bo\'ldi?">' + esc(r.note) + "</textarea></label>" +
      '<pre class="report" id="reportText"></pre>' +
      '<div class="row"><button type="button" class="btn accent" id="copy">📋 Nusxalash</button><button type="button" class="btn soft" id="share">↗ Yuborish</button></div></section>';

    html += settingsCard();
    $("main").innerHTML = html;
    updateReport();
    updateUsed();
    bindSettings();
  }

  function settingsCard() {
    var rm = S.remind;
    return '<section class="card"><div class="head"><span class="num">⚙</span><h2>Sozlamalar</h2></div>' +
      '<label class="done-box" style="color:inherit"><input type="checkbox" id="remOn"' + (rm.on ? " checked" : "") + "> Kunlik eslatmalar</label>" +
      '<div class="row"><label class="grow">Ertalab (vazifa)<input type="time" id="remM" value="' + esc(rm.morning) + '"></label>' +
      '<label class="grow">Kechqurun (hisobot)<input type="time" id="remE" value="' + esc(rm.evening) + '"></label></div>' +
      '<label>Dastur boshlangan kun<input type="date" id="startDate" value="' + esc(S.start) + '"></label>' +
      '<div class="foot small"><a href="classic.html">Avvalgi Poliglot dasturi (eski 30 kunlik)</a></div></section>';
  }

  function bindSettings() {
    var on = $("remOn");
    if (!on) return;
    function apply() {
      S.remind = { on: on.checked, morning: $("remM").value || "08:00", evening: $("remE").value || "21:00" };
      save();
      scheduleReminders();
    }
    on.onchange = apply; $("remM").onchange = apply; $("remE").onchange = apply;
    $("startDate").onchange = function () {
      if (!C.parseDate(this.value)) return;
      S.start = this.value; save(); view = today(); render();
    };
  }

  function scheduleReminders() {
    if (!A || !A.setReminders) return;
    var rm = S.remind;
    function hm(v) { var p = String(v).split(":").map(Number); return p.length === 2 && !isNaN(p[0]) ? p : [-1, 0]; }
    var m = rm.on ? hm(rm.morning) : [-1, 0];
    var e = rm.on ? hm(rm.evening) : [-1, 0];
    try { A.setReminders(m[0], m[1], e[0], e[1]); } catch (err) {}
    toast(rm.on ? "Eslatmalar: " + rm.morning + " va " + rm.evening : "Eslatmalar o'chirildi");
  }

  function updateReport() {
    var el = $("reportText");
    if (el) el.textContent = C.eveningReport(content, S, view);
  }

  function updateUsed() {
    var el = $("usedWords");
    var d = C.dayOf(content, view);
    if (!el || !d) return;
    var text = (rec(view).writing || []).join(" ");
    var used = d.new_words.filter(function (w) { return C.termPattern(w.en).test(text); }).map(function (w) { return w.en; });
    el.textContent = "Yangi so'zlardan ishlatildi: " + used.length + "/" + d.new_words.length + (used.length ? " (" + used.join(", ") + ")" : "");
  }

  function render() { renderDays(); renderDay(); }

  // ---- Hodisalar ----
  function showTip(en, uz) {
    var tip = $("tip");
    tip.querySelector(".en").textContent = en;
    tip.querySelector(".uz").textContent = uz;
    tip.dataset.say = en.split(" / ")[0].replace(/\([^)]*\)/g, "").replace(/\.\.\./g, "").trim();
    tip.classList.add("show");
  }
  function hideTip() { $("tip").classList.remove("show"); }

  document.addEventListener("click", function (ev) {
    var t = ev.target.closest("button, [data-en], [data-ar]");
    if (!t) return;
    var d = C.dayOf(content, view);
    if (t.dataset.day) { view = +t.dataset.day; hideTip(); render(); window.scrollTo(0, 0); return; }
    if (t.dataset.en) { showTip(t.dataset.en, t.dataset.uz); return; }
    if (t.id === "tipClose") { hideTip(); return; }
    if (t.id === "tipSay") { speak($("tip").dataset.say, "en-US", 0.85); return; }
    if (t.dataset.ar) { speak(t.dataset.ar, "ar", 0.75); return; }
    if (t.dataset.say === "story") { speak(d.story, "en-US", 0.9); return; }
    if (t.dataset.say === "story-slow") { speak(d.story, "en-US", 0.7); return; }
    if (t.dataset.say === "hadith") { speak(d.hadith.en, "en-US", 0.85); return; }
    if (t.dataset.say === "retell") {
      var parts = d.retell_frame.split(/_{2,}/);
      var r = rec(view).retell;
      speak(parts.map(function (p, i) { return p + (i < parts.length - 1 ? (r[i] || "") : ""); }).join(""), "en-US", 0.9);
      return;
    }
    if (t.dataset.sayq) { speak(d.questions[+t.dataset.sayq], "en-US", 0.9); return; }
    if (t.dataset.mic) { listen(t.dataset.mic); return; }
    if (t.dataset.mode) { S.mode = t.dataset.mode; save(); renderDay(); return; }
    if (t.dataset.fluency) { rec(view).fluency = +t.dataset.fluency; save(); renderDay(); return; }
    if (t.id === "talk") {
      var prompt = C.agentPrompt(content, view, S.mode || "suhbat", C.reviewWords(content, view, (S.days[view - 1] || {}).forgotten));
      if (A && A.openClaude) { try { A.openClaude(prompt); } catch (e) {} } else { window.open("https://claude.ai/new?q=" + encodeURIComponent(prompt)); }
      toast("Matn nusxalandi");
      return;
    }
    if (t.id === "copy") {
      var text = C.eveningReport(content, S, view);
      if (A && A.copy) { try { A.copy(text); } catch (e) {} } else if (navigator.clipboard) { navigator.clipboard.writeText(text); }
      toast("Hisobot nusxalandi — Claude'ga joylang");
      return;
    }
    if (t.id === "share") {
      if (A && A.share) { try { A.share(C.eveningReport(content, S, view)); } catch (e) {} }
      return;
    }
  });
  document.addEventListener("keydown", function (ev) {
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("[data-en], span[data-ar]")) { ev.preventDefault(); ev.target.click(); }
  });

  document.addEventListener("change", function (ev) {
    var t = ev.target;
    if (t.dataset.task) {
      rec(view).tasks[t.dataset.task] = t.checked;
      save(); render();
      if (t.checked) toast("✓ " + taskLabel(t.dataset.task).split("(")[0].trim());
      return;
    }
    if (t.dataset.forgot) {
      var list = rec(view).forgotten;
      var i = list.indexOf(t.dataset.forgot);
      if (t.checked && i < 0) list.push(t.dataset.forgot);
      if (!t.checked && i >= 0) list.splice(i, 1);
      save(); updateReport();
    }
  });
  document.addEventListener("input", function (ev) {
    var t = ev.target;
    if (!t.dataset.field) return;
    var r = rec(view);
    if (t.dataset.i != null) r[t.dataset.field][+t.dataset.i] = t.value;
    else r[t.dataset.field] = t.value;
    clearTimeout(save.timer); save.timer = setTimeout(save, 400);
    if (t.dataset.field === "writing") updateUsed();
    updateReport();
  });

  /** Telefon tomonidan: nutq natijasi, ruxsatlar. */
  window.onNative = function (type, arg) {
    if (type === "speech" && micTarget) {
      var el = $(micTarget);
      if (el) { el.value = (el.value ? el.value + " " : "") + arg; el.dispatchEvent(new Event("input", { bubbles: true })); }
    } else if (type === "speechError") {
      toast(arg === "none" ? "Telefonda nutqni tanish xizmati yo'q" : "Ovoz olinmadi");
    } else if (type === "tts" && String(arg).indexOf("missing") === 0) {
      toast("Telefon sozlamalarida bu til ovozini yuklab oling");
    } else if (type === "mic" && arg === "denied") {
      toast("Mikrofonga ruxsat berilmadi");
    } else if (type === "claude") {
      toast("Claude ochilmadi — matn nusxalandi, o'zingiz joylang");
    } else if (type === "notif" && arg === "denied") {
      toast("Bildirishnomaga ruxsat berilmadi");
    }
  };
  window.onBack = function () {
    if ($("tip").classList.contains("show")) { hideTip(); return true; }
    return false;
  };

  function start(json) {
    content = json;
    S = load() || { v: 2, start: content.start_date, days: {}, remind: { on: false, morning: "08:00", evening: "21:00" }, mode: "suhbat" };
    if (!C.parseDate(S.start)) S.start = content.start_date;
    view = today();
    if (!C.dayOf(content, view)) {
      var last = content.days[content.days.length - 1];
      if (last && view > last.day) view = last.day;
    }
    save();
    render();
  }

  fetch("../poliglot_content.json").then(function (r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }).then(start).catch(function () {
    $("main").innerHTML = '<div class="card empty">Dastur fayli o\'qilmadi. Ilovani qayta oching.</div>';
  });
})();
</script>
</body>
</html>
